<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>EXORA Loader</title>
  <style>
    body {
      background-color: #121212;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      position: relative;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      position: absolute;
      top: 100px;
      margin: 0;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      background: linear-gradient(
        135deg, 
        #ff0000, 
        #ff7f00, 
        #ffff00, 
        #00ff00, 
        #0000ff, 
        #4b0082, 
        #8b00ff, 
        #ff0000
      );
      background-size: 400% 400%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rgbGlow 6s linear infinite;
      filter: drop-shadow(0 0 15px rgba(255, 0, 128, 0.4));
    }

    @keyframes rgbGlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .loader {
      width: 100px;
      height: 100px;
      color: #554cb5;
      position: relative;
      background: radial-gradient(25px, currentColor 94%, #0000);
    }

    .loader:before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: 
        radial-gradient(22.5px at bottom right, #0000 94%, currentColor) top left,
        radial-gradient(22.5px at bottom left, #0000 94%, currentColor) top right,
        radial-gradient(22.5px at top right, #0000 94%, currentColor) bottom left,
        radial-gradient(22.5px at top left, #0000 94%, currentColor) bottom right;
      background-size: 50px 50px;
      background-repeat: no-repeat;
      animation: loader 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
    }

    @keyframes loader {
      33% {
        inset: -25px;
        transform: rotate(0deg);
      }
      66% {
        inset: -25px;
        transform: rotate(90deg);
      }
      100% {
        inset: 0;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>

  <h1>EXORA</h1>
  <div class="loader"></div>

<script>
setTimeout(() => {
    window.location.href = "login.html";
}, 4000);
</script>

</body>
</html>
